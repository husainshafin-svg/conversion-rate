
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F6F4EF;
    --surface: #FFFFFF;
    --ink: #1B1C19;
    --ink-soft: #55564F;
    --line: #DEDBD1;
    --accent: #1F6F5C;
    --accent-soft: #E4EFEA;
    --radius: 3px;

    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

    --max-width: 780px;
  }

  [data-theme="dark"] {
    --bg: #15160F;
    --surface: #1D1E17;
    --ink: #ECEAE0;
    --ink-soft: #A6A498;
    --line: #34352A;
    --accent: #4FCB9F;
    --accent-soft: #1E2E26;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  header.site-header { border-bottom: 1px solid var(--line); }

  .header-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 28px 24px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }

  .site-title { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; letter-spacing: -0.01em; }
  .site-title .tick { color: var(--accent); }

  nav.site-nav { display: flex; align-items: center; gap: 22px; font-size: 0.92rem; }

  nav.site-nav a {
    color: var(--ink-soft);
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  nav.site-nav a:hover { color: var(--ink); border-color: var(--accent); }

  #theme-toggle {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    padding: 5px 9px;
    cursor: pointer;
  }

  #theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .featured { max-width: var(--max-width); margin: 40px auto 8px; padding: 0 24px; }

  .featured-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }

  .featured-card::before {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 140px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent));
  }

  .featured-cover-wrap {
    width: 100%;
    max-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .featured-cover {
    max-width: 100%;
    max-height: 480px;
    width: auto;
    height: auto;
    object-fit: contain;
    image-rendering: auto;
  }

  .post-row-inner {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .post-row-thumb {
    width: 120px;
    height: 90px;
    object-fit: contain;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .post-row-content { flex: 1; min-width: 0; }

  @media (max-width: 640px) {
    .post-row-thumb { width: 84px; height: 64px; }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .eyebrow::before { content: "▲"; font-size: 0.65rem; }

  .featured h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 4vw, 2.35rem);
    line-height: 1.18;
    font-weight: 600;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .featured p.excerpt { color: var(--ink-soft); font-size: 1.02rem; margin: 0 0 20px; max-width: 62ch; }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
